{% include base_path %}

<!-- start custom head snippets -->

<!-- jQuery (lo necesita el menú y el cambio de tema; debe cargar primero) -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

<!-- Tema oscuro sin parpadeo: aplica data-theme antes de pintar (misma lógica que el template) -->
<script>
  (function () { try {
    var t = localStorage.getItem("theme");
    var dark = t === "dark" || (t !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    if (dark) document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {} })();
</script>

<!-- Tipografías: Newsreader (títulos), Inter (texto) y JetBrains Mono (cifras) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">

<!-- Íconos (Font Awesome local) -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Favicon "GP" -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#161513" media="(prefers-color-scheme: dark)"/>

<!-- Vista previa al compartir (las etiquetas og:title, og:description y og:image salen de seo.html) -->
<meta property="og:image:alt" content="Mapa del área quemada en Chichas (Arequipa) medida con Sentinel-2">
<meta name="twitter:card" content="summary_large_image">

<!-- end custom head snippets -->
