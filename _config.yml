# Configuración del sitio de Gabriela Pozo.
# Este archivo NO se recarga solo con `jekyll serve`: si lo cambias, reinicia el servidor.

# Datos básicos del sitio
locale                   : "es-ES"
site_theme               : "default" # el tema ya respeta el modo claro/oscuro del sistema
title                    : "Gabriela Pozo"
title_separator          : "·"
name                     : &name "Gabriela Pozo"
description              : &description "Análisis con datos abiertos: la pregunta, el hallazgo con su fuente y lo que no se pudo medir."
url                      : https://gabriela-pozo.github.io
baseurl                  : ""
repository               : "gabriela-pozo/gabriela-pozo.github.io"

# Autora. Si un campo queda vacío, su ícono o enlace no aparece.
# NO se publica teléfono ni dirección en ninguna parte del sitio.
author:
  avatar           : "foto.jpg"
  name             : "Gabriela Pozo"
  pronouns         :
  bio              : "Análisis con datos abiertos."
  location         : "Perú"
  employer         :
  uri              :
  email            : "gabrielapb36@gmail.com"

  # Redes (vacío = no se muestra)
  github           : "gabriela-pozo"
  linkedin         : # PENDIENTE: solo el usuario, p. ej. "gabriela-pozo". Al llenarlo aparece el botón de LinkedIn en el inicio.

# Redes sociales / vista previa al compartir
teaser                   : # imagen alternativa (en /images/) cuando una página no trae la suya
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
comments:
  provider               : # sin comentarios
atom_feed:
  path                   : /publicaciones.xml
  hide                   : false

feed:
  collections:
    portfolio:
      path: "/publicaciones.xml"

# SEO y Open Graph (la imagen de vista previa es el mapa del proyecto de incendios)
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : og-image.jpg   # vive en /images/
og_description           : *description
social:
  type                   : Person
  name                   : "Gabriela Pozo"
  links:
    - "https://github.com/gabriela-pozo"

# Analítica: desactivada
analytics:
  provider               : "false"
  google:
    tracking_id          :

# Archivos que entran o no al sitio publicado
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - AGENTS.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - CV-Gabriela Pozo.pdf
  - CV-Gabriela-Pozo.pdf
  - docker-compose.yaml
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - README.md
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversión
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Única colección en uso: los proyectos (carpeta _portfolio/)
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/
  portfolio_en:
    output: true
    permalink: /en/projects/:path/


# Valores por defecto: sin barra lateral en ninguna página
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: portfolio
    values:
      layout: proyecto
      author_profile: false
  - scope:
      path: ""
      type: portfolio_en
    values:
      layout: proyecto
      author_profile: false
      lang: en


# Sass
sass:
  sass_dir: _sass
  style: compressed


# Salida
permalink: /:categories/:title/
timezone: America/Lima


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archivos de categorías y etiquetas (no se usan, se dejan por compatibilidad del template)
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/


# Compresión de HTML
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
